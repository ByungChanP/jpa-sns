spring:
  application:
    name: jpa-sns
  # 데이터베이스 접속 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://localhost:3306/jpa_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    username: jpa-app
    password: 'Jpa1234!'

  # 데이터 베이스 초기화 설정
  sql:
    init:
      mode: always
#      mode: never

  # JPA 및 하이버네이트 설정 (table 생성)
  jpa:
    defer-datasource-initialization:  true # hibernate의 DDL 생성 완료 후 data.sql 로드 및 실행
    hibernate:
#      ddl-auto: none
      ddl-auto: create

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true